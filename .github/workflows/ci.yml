# 工作流名称，会显示在GitHub Actions页面
name: Python单元测试

# 触发条件：代码推送、提交PR时自动运行测试
on: [push, pull_request]

# 任务集
jobs:
  # 测试任务的id，可自定义
  test:
    # 运行环境：使用GitHub提供的最新版Ubuntu虚拟机
    runs-on: ubuntu-latest

    # 任务执行步骤
    steps:
      # 步骤1：把仓库代码拉取到虚拟机中
      - name: 检出代码
        uses: actions/checkout@v4

      # 步骤2：配置Python环境
      - name: 设置Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'  # 指定Python版本

      # 步骤3：安装测试依赖（pytest）
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      # 步骤4：执行单元测试，-v参数输出详细结果
      - name: 运行测试
        run: pytest -v
